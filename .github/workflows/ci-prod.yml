name: CI Build & Deploy Prod

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push-prod:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create application-prod.yml
        run: |
          mkdir -p ./src/main/resources
          echo "${{ secrets.APPLICATION_PROD }}" > ./src/main/resources/application-prod.yml
        shell: bash

      - name: Create FirebaseAdminKey.json
        run: |
          rm -rf ./FirebaseAdminKey.json
          cat > ./FirebaseAdminKey.json << 'EOKEY'
          ${{ secrets.FIREBASE_ADMIN_KEY }}
          EOKEY
        shell: bash

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        shell: bash

      - name: Build with Gradle
        run: ./gradlew clean build -x test
        shell: bash

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/ono:prod-latest
            ${{ secrets.DOCKER_USERNAME }}/ono:prod-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-prod:
    needs: build-and-push-prod
    runs-on: self-hosted
    concurrency:
      group: deploy-prod
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Resolve deployment metadata
        run: |
          echo "DEPLOY_SHA=${{ github.sha }}" >> "$GITHUB_ENV"
          echo "DEPLOY_BRANCH=${{ github.ref_name }}" >> "$GITHUB_ENV"
          echo "APP_TAG=prod-${{ github.sha }}" >> "$GITHUB_ENV"
        shell: bash

      - name: Create .env file
        run: |
          cat > .env.prod << EOFENV
          DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
          MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
          RABBITMQ_USER=${{ secrets.RABBITMQ_USER }}
          RABBITMQ_PASSWORD=${{ secrets.RABBITMQ_PASSWORD }}
          SPRING_CRYPTO_SECRET_KEY=${{ secrets.SPRING_CRYPTO_SECRET_KEY }}
          JWT_ACCESS_TOKEN_SECRET=${{ secrets.JWT_ACCESS_TOKEN_SECRET }}
          JWT_ACCESS_TOKEN_EXPIRATION=1800000
          JWT_REFRESH_TOKEN_SECRET=${{ secrets.JWT_REFRESH_TOKEN_SECRET }}
          JWT_REFRESH_TOKEN_EXPIRATION=60480000000
          CLOUD_AWS_S3_BUCKET=${{ secrets.CLOUD_AWS_S3_BUCKET }}
          CLOUD_AWS_CREDENTIALS_ACCESS_KEY=${{ secrets.CLOUD_AWS_CREDENTIALS_ACCESS_KEY }}
          CLOUD_AWS_CREDENTIALS_SECRET_KEY=${{ secrets.CLOUD_AWS_CREDENTIALS_SECRET_KEY }}
          DISCORD_WEBHOOK_URL=${{ secrets.DISCORD_WEBHOOK_URL }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          SENTRY_DSN=${{ secrets.SENTRY_DSN }}
          ADMIN_IDENTIFIER=${{ secrets.ADMIN_IDENTIFIER }}
          ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
          GRAFANA_ADMIN_USER=${{ secrets.GRAFANA_ADMIN_USER }}
          GRAFANA_ADMIN_PASSWORD=${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          GRAFANA_PROD_ROOT_URL=https://ono-prod.seungminki.shop/grafana/
          GRAFANA_PROD_SERVE_FROM_SUB_PATH=true
          PROMETHEUS_PROD_EXTERNAL_URL=https://ono-prod.seungminki.shop/prometheus/
          PROMETHEUS_PROD_ROUTE_PREFIX=/prometheus
          EOFENV
        shell: bash

      - name: Blue-Green Deployment
        # 전환 전 확인(scripts/smoke/pre_switch_check.sh)이 스모크 계정 토큰을 만들 때 쓴다.
        # 서버가 실제로 쓰는 서명 키는 APPLICATION_PROD 안의 jwt.*.secret 이다. 컨테이너에 넘기는 JWT_*_TOKEN_SECRET 환경변수는
        # Spring 이 jwt.accessToken.secret 으로 읽지 않는다. access 키는 배포 뒤 스모크 full 이 통과해서 같은 값인 것이 확인됐고,
        # refresh 키는 아직 확인되지 않아서 여기에는 넘기지 않는다. 배포 뒤 smoke-test.yml 이 refresh 까지 보고 알린다.
        env:
          SMOKE_ACCESS_TOKEN_SECRET: ${{ secrets.JWT_ACCESS_TOKEN_SECRET }}
          SMOKE_USER_ID: ${{ secrets.SMOKE_PROD_USER_ID }}
        run: |
          export DOCKER_CONFIG=/tmp/.docker-ci
          mkdir -p "$DOCKER_CONFIG"
          DOCKER="docker --config $DOCKER_CONFIG"
          AUTH_B64=$(printf '%s:%s' "${{ secrets.DOCKER_USERNAME }}" "${{ secrets.DOCKER_PASSWORD }}" | base64 | tr -d '\n')
          cat > "$DOCKER_CONFIG/config.json" << EOF
          {"auths":{"https://index.docker.io/v1/":{"auth":"$AUTH_B64"}}}
          EOF

          $DOCKER pull ${{ secrets.DOCKER_USERNAME }}/ono:${APP_TAG}
          $DOCKER tag ${{ secrets.DOCKER_USERNAME }}/ono:${APP_TAG} ${{ secrets.DOCKER_USERNAME }}/ono:prod-latest

          docker-compose -f docker-compose.prod.yml --env-file .env.prod up -d mysql-prod redis-prod

          echo "Cleaning up orphan containers..."
          docker stop ono-app-prod 2>/dev/null || true
          docker rm ono-app-prod 2>/dev/null || true
          docker stop ono-app 2>/dev/null || true
          docker rm ono-app 2>/dev/null || true

          BLUE_RUNNING=$(docker ps --filter "name=ono-app-prod-blue" --filter "status=running" -q)
          GREEN_RUNNING=$(docker ps --filter "name=ono-app-prod-green" --filter "status=running" -q)

          if [ -n "$BLUE_RUNNING" ]; then
            CURRENT="blue"
            TARGET="green"
            CURRENT_PORT=8080
            TARGET_PORT=8081
          elif [ -n "$GREEN_RUNNING" ]; then
            CURRENT="green"
            TARGET="blue"
            CURRENT_PORT=8081
            TARGET_PORT=8080
          else
            CURRENT="none"
            TARGET="blue"
            CURRENT_PORT=0
            TARGET_PORT=8080
          fi

          echo "Current active environment: $CURRENT (port $CURRENT_PORT)"
          echo "Deploying to target environment: $TARGET (port $TARGET_PORT)"

          # 배포를 끝내지 못하면 prod-latest 를 지금 사용자를 받는 이미지로 되돌린다. 위에서 이미 새 이미지로 옮겼고,
          # 그대로 두면 누가 docker-compose up 을 다시 할 때 거절된 빌드가 올라간다.
          PREV_IMAGE=""
          if [ "$CURRENT" != "none" ]; then
            PREV_IMAGE=$(docker inspect --format '{{.Image}}' "ono-app-prod-$CURRENT" 2>/dev/null || true)
          fi
          restore_latest_tag() {
            if [ -n "$PREV_IMAGE" ]; then
              $DOCKER tag "$PREV_IMAGE" ${{ secrets.DOCKER_USERNAME }}/ono:prod-latest \
                || echo "::warning::prod-latest 를 이전 이미지로 되돌리지 못했습니다"
            fi
          }

          if [ "$TARGET" = "green" ]; then
            docker-compose -f docker-compose.prod.yml --env-file .env.prod --profile green up -d app-prod-green
          else
            docker-compose -f docker-compose.prod.yml --env-file .env.prod up -d app-prod-blue
          fi

          echo "Waiting for $TARGET environment to be healthy..."
          timeout=120
          elapsed=0
          healthy=false

          while [ $elapsed -lt $timeout ]; do
            if docker ps | grep "ono-app-prod-$TARGET" | grep -q "healthy"; then
              echo "$TARGET environment is healthy!"
              healthy=true
              break
            fi
            echo "Waiting... ($elapsed seconds)"
            sleep 5
            elapsed=$((elapsed + 5))
          done

          if [ "$healthy" = false ]; then
            echo "ERROR: $TARGET environment failed to become healthy within $timeout seconds"
            docker-compose -f docker-compose.prod.yml logs --tail=100 app-prod-$TARGET
            restore_latest_tag
            exit 1
          fi

          # 전환 전 확인. 실패하면 nginx 를 건드리지 않았으니 이전 색이 계속 사용자를 받는다.
          if ! bash ./scripts/smoke/pre_switch_check.sh "ono-app-prod-$TARGET" "$TARGET_PORT"; then
            if [ "$CURRENT" = "none" ]; then
              # 돌고 있는 앱이 없던 복구 배포다. 새 컨테이너를 내려도 나아지는 것이 없고 복구 수단만 막히니 경고만 하고 이어 간다.
              echo "::warning::전환 전 확인이 실패했지만 돌고 있던 앱이 없어 그대로 전환합니다. 스모크 결과를 확인해야 합니다"
            else
              echo "ERROR: $TARGET environment failed the pre-switch check. Nginx stays on $CURRENT"
              docker-compose -f docker-compose.prod.yml logs --tail=100 app-prod-$TARGET
              # 새 컨테이너는 이름으로 지운다. 남아 있으면 다음 배포가 blue 를 먼저 보고 현재 색을 잘못 읽어,
              # 사용자를 받고 있는 색을 다시 만들 수 있다.
              docker rm -f "ono-app-prod-$TARGET" || true
              if [ -n "$(docker ps -aq --filter "name=^ono-app-prod-$TARGET\$")" ]; then
                echo "::error::ono-app-prod-$TARGET 를 지우지 못했습니다. 다음 배포 전에 직접 지워야 합니다. 남아 있으면 다음 배포가 현재 색을 잘못 판단합니다"
              fi
              restore_latest_tag
              exit 1
            fi
          fi

          echo "Switching Nginx to $TARGET environment (port $TARGET_PORT)..."
          sudo /opt/ono/scripts/switch-nginx.sh $TARGET_PORT

          if sudo /opt/homebrew/bin/nginx -t; then
            sudo /opt/homebrew/bin/nginx -s reload
            echo "Nginx successfully switched to $TARGET environment"
          else
            echo "ERROR: Nginx configuration test failed"
            sudo /opt/ono/scripts/switch-nginx.sh $CURRENT_PORT
            exit 1
          fi

          echo "Waiting 10 seconds before stopping old environment..."
          sleep 10

          if [ "$CURRENT" != "none" ]; then
            echo "Stopping old $CURRENT environment..."
            docker-compose -f docker-compose.prod.yml stop app-prod-$CURRENT || true
            docker-compose -f docker-compose.prod.yml rm -f app-prod-$CURRENT || true
          else
            echo "Initial deployment - no old environment to stop"
          fi

          echo "=== Current Container Status ==="
          docker-compose -f docker-compose.prod.yml ps

          echo "=== $TARGET Environment Logs ==="
          docker-compose -f docker-compose.prod.yml logs --tail=50 app-prod-$TARGET
        shell: bash

      - name: Deploy Monitoring Stack
        run: |
          docker-compose -f docker-compose.prod.yml --env-file .env.prod --profile monitoring pull \
            mysql-exporter-prod redis-exporter-prod alertmanager-prod prometheus-prod loki-prod promtail-prod grafana-prod
          docker-compose -f docker-compose.prod.yml --env-file .env.prod --profile monitoring stop prometheus-prod grafana-prod loki-prod promtail-prod mysql-exporter-prod redis-exporter-prod alertmanager-prod || true
          docker-compose -f docker-compose.prod.yml --env-file .env.prod --profile monitoring rm -f prometheus-prod grafana-prod loki-prod promtail-prod mysql-exporter-prod redis-exporter-prod alertmanager-prod || true
          docker-compose -f docker-compose.prod.yml --env-file .env.prod --profile monitoring up -d --force-recreate \
            mysql-exporter-prod redis-exporter-prod alertmanager-prod prometheus-prod loki-prod promtail-prod grafana-prod
          docker-compose -f docker-compose.prod.yml --env-file .env.prod ps \
            mysql-exporter-prod redis-exporter-prod alertmanager-prod prometheus-prod loki-prod promtail-prod grafana-prod
        shell: bash

      - name: Verify Monitoring Integration
        continue-on-error: true
        run: |
          echo "Checking Prometheus scrape status for production jobs..."

          for i in $(seq 1 12); do
            result=$(docker exec ono-prometheus-prod sh -lc 'wget -qO- "http://localhost:9090/prometheus/api/v1/query?query=max(up{job=~\"ono-backend-prod-(blue|green)\"})"' || true)
            if echo "$result" | grep -q '"value":\[.*,"1"\]'; then
              echo "Prometheus scrape is UP for at least one production target"
              exit 0
            fi
            echo "Waiting scrape up... ($i/12)"
            sleep 5
          done

          echo "WARNING: Prometheus scrape for production targets is still down"
          docker exec ono-prometheus-prod sh -lc 'wget -qO- "http://localhost:9090/prometheus/api/v1/targets"' || true
          docker logs --tail=200 ono-prometheus-prod || true
        shell: bash

      - name: Verify Loki Log Collection
        continue-on-error: true
        run: |
          echo "Checking Loki readiness..."
          for i in $(seq 1 12); do
            if curl -fsS http://localhost:3100/ready | grep -q ready; then
              echo "Loki is ready"
              break
            fi
            echo "Waiting Loki ready... ($i/12)"
            sleep 5
          done

          if ! curl -fsS http://localhost:3100/ready | grep -q ready; then
            echo "WARNING: Loki did not become ready"
            docker logs --tail=200 ono-loki-prod || true
            docker logs --tail=200 ono-promtail-prod || true
            exit 1
          fi

          echo "Checking Loki received production logs..."
          for i in $(seq 1 12); do
            result=$(curl -fsG "http://localhost:3100/loki/api/v1/label/container/values" || true)
            if echo "$result" | grep -Eq '"ono-(app-prod-blue|app-prod-green|mysql-prod|redis-prod|rabbitmq-prod|prometheus-prod|grafana-prod|loki-prod|promtail-prod|mysql-exporter-prod)"'; then
              echo "Loki received production log labels"
              exit 0
            fi
            echo "Waiting Loki production log labels... ($i/12)"
            sleep 5
          done

          echo "WARNING: Loki did not receive expected production log labels"
          curl -fsG "http://localhost:3100/loki/api/v1/labels" || true
          docker logs --tail=200 ono-loki-prod || true
          docker logs --tail=200 ono-promtail-prod || true
          exit 1
        shell: bash

      - name: Clean up old Docker images
        run: |
          docker image prune -f --filter "until=24h"
        shell: bash
        continue-on-error: true

      - name: Send deployment notification
        if: always()
        run: |
          STATUS="${{ job.status }}"
          COLOR="3066993"
          if [ "$STATUS" != "success" ]; then
            COLOR="15158332"
          fi

          curl -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"🚀 Production Deployment $STATUS\",
                \"description\": \"Environment: **PRODUCTION**\\nURL: https://ono-prod.seungminki.shop\\nBranch: \\`${DEPLOY_BRANCH}\\`\\nCommit: \\`${DEPLOY_SHA}\\`\\nAuthor: ${{ github.actor }}\",
                \"color\": $COLOR,
                \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%S.000Z)\"
              }]
            }"
        shell: bash
        continue-on-error: true
