global:
  scrape_interval: 60s
  evaluation_interval: 60s

rule_files:
  - /etc/prometheus/alerts/ono-alerts.yml

scrape_configs:
  - job_name: "ono-backend-dev"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["app-dev:8081"]

  - job_name: "ono-mysql-dev"
    static_configs:
      - targets: ["mysql-exporter-dev:9104"]

  - job_name: "ono-redis-dev"
    static_configs:
      - targets: ["redis-exporter-dev:9121"]

  # prod 와 같다. 큐별 적체와 컨슈머 수를 보려고 detailed 엔드포인트를 쓴다.
  - job_name: "ono-rabbitmq-dev"
    metrics_path: "/metrics/detailed"
    params:
      family: ["queue_coarse_metrics", "queue_consumer_count"]
    static_configs:
      - targets: ["rabbitmq-dev:15692"]
