# 운영자용 조회 전용 MCP 서버 설정.
# application*.yml 은 비밀값과 함께 CI 에서 만들어지고 레포에 없어서, 비밀이 아닌 MCP 설정은 여기에 둔다.
# McpServerPropertiesConfig 가 @PropertySource 로 읽는다. 토큰(mcp.admin.token)은 여기에 두지 않는다.
spring.ai.mcp.server.name=ono-admin
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
# 세션을 들고 있지 않는다. 블루그린 전환 중에도 연결이 끊길 일이 없다.
spring.ai.mcp.server.protocol=STATELESS
# 나중에 사용자용 MCP 를 붙일 때 경로가 겹치지 않도록 /mcp 대신 /mcp/admin 을 쓴다.
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp/admin
# 도구만 쓴다.
spring.ai.mcp.server.capabilities.resource=false
spring.ai.mcp.server.capabilities.prompt=false
spring.ai.mcp.server.capabilities.completion=false
spring.ai.mcp.server.instructions=OnO 오답노트 앱의 운영 데이터를 조회하는 관리자 전용 도구입니다. 모든 도구는 조회만 하며, 날짜 기준은 한국 시간(KST)입니다. 사용자는 userId 로만 구분하고 이름과 이메일은 돌려주지 않습니다. 요약과 지표 숫자는 게스트와 관리자 계정을 뺀 실사용자 기준이고, 목록에는 모든 계정이 나오므로 두 숫자가 다를 수 있습니다.
