<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-layout :: head('피드백')}"></head>
<body>
<div class="shell">
  <aside th:replace="~{fragments/admin-layout :: sidebar('feedbacks')}"></aside>
  <main class="main" data-reveal>
    <div class="page-head">
      <div>
        <h1>피드백</h1>
        <p class="desc">앱 설문으로 받은 응답이에요.</p>
      </div>
    </div>

    <div class="kpis">
      <div class="kpi">
        <div class="kpi-label">전체 응답</div>
        <div class="kpi-value"><span data-count th:text="${totalCount}">0</span><span class="unit">건</span></div>
      </div>
      <div class="kpi">
        <div class="kpi-label">평균 추천 점수</div>
        <div class="kpi-value" th:if="${averageNps != null}">
          <span data-count th:text="${#numbers.formatDecimal(averageNps, 1, 1)}">0.0</span><span class="unit">/ 10</span>
        </div>
        <div class="kpi-value muted" th:if="${averageNps == null}">-</div>
      </div>
    </div>

    <div class="card flush section">
      <div class="table-wrap">
        <table class="table">
          <thead>
          <tr>
            <th>제출</th>
            <th>추천 점수</th>
            <th>사용 목적</th>
            <th>사용 빈도</th>
            <th>자주 쓰는 기능</th>
            <th>불편한 점</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="f : ${feedbacks}" th:attr="data-href=@{/admin/feedbacks/{id}(id=${f.id})}">
            <td class="nowrap muted num" th:text="${f.submittedAt != null ? #temporals.format(f.submittedAt, 'yyyy.MM.dd HH:mm') : '-'}">2026.09.21 12:00</td>
            <td>
              <span th:if="${f.npsScore != null}" class="chip"
                    th:classappend="${f.npsScore >= 9 ? 'green' : (f.npsScore >= 7 ? 'orange' : 'red')}"
                    th:text="${f.npsScore}">9</span>
              <span th:if="${f.npsScore == null}" class="muted">-</span>
            </td>
            <td class="ellipsis" th:text="${f.usagePurpose ?: '-'}">수능</td>
            <td class="nowrap" th:text="${f.usageFrequency ?: '-'}">주 1~2회</td>
            <td class="ellipsis" th:text="${f.mostUsedFeature ?: '-'}">스터디룸</td>
            <td class="ellipsis muted" th:text="${f.painPoints ?: '-'}">-</td>
          </tr>
          </tbody>
        </table>
      </div>
      <div class="empty" th:if="${#lists.isEmpty(feedbacks)}">아직 받은 피드백이 없어요.</div>
      <div th:replace="~{fragments/admin-layout :: pager(${pager})}"></div>
    </div>
  </main>
</div>
<th:block th:replace="~{fragments/admin-layout :: scripts}"></th:block>
</body>
</html>
