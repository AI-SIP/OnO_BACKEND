<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>로그인 | OnO 관리자</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" th:href="@{/css/admin.css}">
  <style>
    body { background: var(--surface); }
    .login {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .login-box { width: 100%; max-width: 360px; }
    .login h1 { margin: 18px 0 32px; font-size: 26px; font-weight: 700; letter-spacing: -.03em; line-height: 1.35; }
    .login form { display: flex; flex-direction: column; gap: 14px; }
    .login .input { height: 52px; font-size: 16px; border-radius: 14px; background: var(--surface-2); border-color: transparent; }
    .login .input:focus { background: var(--surface); }
    .login .btn { height: 54px; font-size: 16px; border-radius: 14px; margin-top: 12px; }
  </style>
</head>
<body>
<div class="login">
  <div class="login-box reveal">
    <span class="brand-mark">On<b>O</b></span>
    <h1>관리자 계정으로<br>로그인해 주세요</h1>

    <div class="notice-box err" th:if="${param.error}">아이디나 비밀번호가 맞지 않아요.</div>
    <div class="notice-box ok" th:if="${param.logout}">로그아웃했어요.</div>

    <form th:action="@{/perform_login}" method="post">
      <input class="input" type="text" id="username" name="username" placeholder="아이디" autocomplete="username" required autofocus>
      <input class="input" type="password" id="password" name="password" placeholder="비밀번호" autocomplete="current-password" required>
      <button type="submit" class="btn primary">로그인</button>
    </form>
  </div>
</div>
</body>
</html>
