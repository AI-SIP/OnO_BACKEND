<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-layout :: head('피드백 상세')}"></head>
<body>
<div class="shell">
  <aside th:replace="~{fragments/admin-layout :: sidebar('feedbacks')}"></aside>
  <main class="main" data-reveal>
    <div class="page-head">
      <div>
        <a class="crumb" th:href="@{/admin/feedbacks}">피드백</a>
        <h1 th:text="|응답 #${feedback.id}|">응답 #1</h1>
        <p class="desc num" th:text="${feedback.submittedAt != null ? #temporals.format(feedback.submittedAt, 'yyyy년 M월 d일 HH:mm') + ' 제출' : '제출 시각 없음'}">제출</p>
      </div>
    </div>

    <div class="kpis">
      <div class="kpi">
        <div class="kpi-label">추천 점수</div>
        <div class="kpi-value" th:classappend="${feedback.npsScore == null ? 'muted' : (feedback.npsScore >= 9 ? 'green' : (feedback.npsScore >= 7 ? '' : 'red'))}">
          <th:block th:text="${feedback.npsScore ?: '-'}">9</th:block><span class="unit" th:if="${feedback.npsScore != null}">/ 10</span>
        </div>
      </div>
      <div class="kpi">
        <div class="kpi-label">템플릿 만족도</div>
        <div class="kpi-value"><th:block th:text="${feedback.templateSatisfaction ?: '-'}">4</th:block><span class="unit" th:if="${feedback.templateSatisfaction != null}">/ 5</span></div>
      </div>
      <div class="kpi">
        <div class="kpi-label">챌린지 동기부여</div>
        <div class="kpi-value"><th:block th:text="${feedback.challengeMotivation ?: '-'}">4</th:block><span class="unit" th:if="${feedback.challengeMotivation != null}">/ 5</span></div>
      </div>
      <div class="kpi">
        <div class="kpi-label">문제 공유 유용성</div>
        <div class="kpi-value"><th:block th:text="${feedback.problemSharingUsefulness ?: '-'}">4</th:block><span class="unit" th:if="${feedback.problemSharingUsefulness != null}">/ 5</span></div>
      </div>
    </div>

    <div class="grid grid-2 section">
      <div class="card">
        <h2 class="card-title">사용 방식</h2>
        <dl class="kv">
          <dt>사용 목적</dt><dd th:text="${feedback.usagePurpose ?: '응답 없음'}">-</dd>
          <dt>사용 빈도</dt><dd th:text="${feedback.usageFrequency ?: '응답 없음'}">-</dd>
          <dt>자주 쓰는 기능</dt><dd th:text="${feedback.mostUsedFeature ?: '응답 없음'}">-</dd>
          <dt>분류 방식</dt><dd th:text="${feedback.classificationMethod ?: '응답 없음'}">-</dd>
          <dt>등록할 때 불편</dt><dd th:text="${feedback.registrationPainPoints ?: '응답 없음'}">-</dd>
        </dl>
      </div>
      <div class="card">
        <h2 class="card-title">복습과 스터디룸</h2>
        <dl class="kv">
          <dt>복습 알림 효과</dt><dd th:text="${feedback.notificationEffectiveness ?: '응답 없음'}">-</dd>
          <dt>복습노트</dt>
          <dd>
            <span th:if="${feedback.practiceNoteUsed == null}" class="muted">응답 없음</span>
            <span th:if="${feedback.practiceNoteUsed != null and feedback.practiceNoteUsed}" class="chip green">사용 중</span>
            <span th:if="${feedback.practiceNoteUsed != null and !feedback.practiceNoteUsed}" class="chip">사용하지 않음</span>
          </dd>
          <dt>안 쓰는 이유</dt><dd th:text="${feedback.reviewSetNonUsageReason ?: '응답 없음'}">-</dd>
          <dt>스터디룸</dt><dd th:text="${feedback.studyRoomUsage ?: '응답 없음'}">-</dd>
          <dt>안 쓰는 이유</dt><dd th:text="${feedback.studyRoomNonUsageReason ?: '응답 없음'}">-</dd>
        </dl>
      </div>
    </div>

    <div class="card section">
      <h2 class="card-title">자유 의견</h2>
      <div class="prose-label">불편한 점</div>
      <div class="quote" th:text="${feedback.painPoints ?: '응답 없음'}">-</div>
      <div class="prose-label">바라는 기능</div>
      <div class="quote" th:text="${feedback.desiredFeatures ?: '응답 없음'}">-</div>
      <p class="small muted mt-20" th:text="|응답 IP ${feedback.ipAddress ?: '-'}|">응답 IP</p>
    </div>
  </main>
</div>
<th:block th:replace="~{fragments/admin-layout :: scripts}"></th:block>
</body>
</html>
