<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-layout :: head('스터디룸')}"></head>
<body>
<div class="shell">
  <aside th:replace="~{fragments/admin-layout :: sidebar('rooms')}"></aside>

  <main class="main" data-reveal>
    <div class="page-head">
      <div>
        <h1>스터디룸</h1>
        <p class="desc">방마다 누가 모여서 무엇을 하고 있는지 볼 수 있어요. 숫자는 게스트와 관리자 계정을 빼고 셌어요.</p>
      </div>
    </div>

    <div class="kpis">
      <div class="kpi">
        <div class="kpi-label">전체 방</div>
        <div class="kpi-value"><span data-count th:text="${overview.totalRooms()}">0</span><span class="unit">개</span></div>
      </div>
      <div class="kpi">
        <div class="kpi-label">이번 주 활동한 방</div>
        <div class="kpi-value"><span data-count th:text="${overview.activeRoomsThisWeek()}">0</span><span class="unit">개</span></div>
        <div class="kpi-sub">월요일부터 피드가 한 번이라도 쌓인 방</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">참여 중인 멤버</div>
        <div class="kpi-value"><span data-count th:text="${overview.totalMembers()}">0</span><span class="unit">명</span></div>
        <div class="kpi-sub">여러 방에 들어간 유저는 방마다 셉니다</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">공유된 문제</div>
        <div class="kpi-value"><span data-count th:text="${overview.sharedProblems()}">0</span><span class="unit">개</span></div>
      </div>
      <div class="kpi">
        <div class="kpi-label">진행 중인 챌린지</div>
        <div class="kpi-value"><span data-count th:text="${overview.inProgressChallenges()}">0</span><span class="unit">개</span></div>
      </div>
    </div>

    <div class="section">
      <div class="card flush">
        <div class="table-wrap">
          <table class="table">
            <thead>
            <tr>
              <th>방</th>
              <th>방장</th>
              <th class="r">멤버</th>
              <th class="r">공유 문제</th>
              <th class="r">댓글</th>
              <th class="r">챌린지</th>
              <th>최근 활동</th>
              <th>만든 날</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="r : ${rooms}" th:attr="data-href=@{/admin/study-rooms/{id}(id=${r.id()})}">
              <td>
                <div class="room-name">
                  <span class="room-thumb">
                    <img th:if="${r.thumbnailUrl() != null and r.thumbnailUrl().startsWith('http')}"
                         th:src="${r.thumbnailUrl()}" alt="" loading="lazy">
                  </span>
                  <div class="who">
                    <b th:text="${r.name()}">방 이름</b>
                    <span th:text="|#${r.id()}|">#1</span>
                  </div>
                </div>
              </td>
              <td>
                <a th:if="${r.hostUserId() != null}" class="link" th:href="@{/admin/user/{id}(id=${r.hostUserId()})}"
                   th:text="${r.hostName() ?: '탈퇴한 유저'}">방장</a>
                <span th:if="${r.hostUserId() == null}" class="muted">-</span>
              </td>
              <td class="r" th:text="${r.memberCount()}">1</td>
              <td class="r" th:classappend="${r.sharedProblemCount() == 0} ? 'zero'" th:text="${r.sharedProblemCount()}">0</td>
              <td class="r" th:classappend="${r.commentCount() == 0} ? 'zero'" th:text="${r.commentCount()}">0</td>
              <td class="r nowrap">
                <span th:if="${r.inProgressChallengeCount() > 0}" class="chip green" th:text="|진행 ${r.inProgressChallengeCount()}|">진행 1</span>
                <span th:if="${r.completedChallengeCount() > 0}" class="chip" th:text="|완료 ${r.completedChallengeCount()}|">완료 1</span>
                <span th:if="${r.inProgressChallengeCount() == 0 and r.completedChallengeCount() == 0}" class="zero">0</span>
              </td>
              <td class="nowrap">
                <span th:if="${r.lastActivityAt() != null}" th:text="${#temporals.format(r.lastActivityAt(), 'yyyy-MM-dd HH:mm')}">2026-09-21 10:00</span>
                <span th:if="${r.lastActivityAt() == null}" class="muted">활동 없음</span>
              </td>
              <td class="nowrap muted" th:text="${#temporals.format(r.createdAt(), 'yyyy-MM-dd')}">2026-09-01</td>
            </tr>
            </tbody>
          </table>
        </div>
        <div th:if="${#lists.isEmpty(rooms)}" class="empty">아직 만들어진 스터디룸이 없어요</div>
        <div th:replace="~{fragments/admin-layout :: pager(${pager})}"></div>
      </div>
    </div>
  </main>
</div>
<style>
  .room-name { display: flex; align-items: center; gap: 12px; }
  .room-thumb { flex: none; width: 36px; height: 36px; border-radius: 10px; background: var(--surface-3); overflow: hidden; }
  .room-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
</style>
<th:block th:replace="~{fragments/admin-layout :: scripts}"></th:block>
</body>
</html>
