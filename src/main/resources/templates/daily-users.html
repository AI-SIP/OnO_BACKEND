<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-layout :: head(${title})}"></head>
<body>
<div class="shell">
  <aside th:replace="~{fragments/admin-layout :: sidebar('analysis')}"></aside>
  <main class="main" data-reveal>

    <div class="page-head">
      <div>
        <a class="crumb" th:href="@{/admin/analysis}">통계</a>
        <h1 th:text="|${#temporals.format(date, 'M월 d일')} ${title}|">9월 1일 신규 가입자</h1>
        <p class="desc num" th:text="|${#temporals.format(date, 'yyyy-MM-dd')}, 총 ${#lists.size(users)}명|">2026-09-01, 총 0명</p>
      </div>
      <div class="seg">
        <a th:href="@{/admin/analysis/daily-new-users(date=${date})}" th:classappend="${type == 'new'} ? 'on'">신규 가입</a>
        <a th:href="@{/admin/analysis/daily-active-users(date=${date})}" th:classappend="${type == 'active'} ? 'on'">출석</a>
      </div>
    </div>

    <div class="card flush">
      <div class="table-wrap">
        <table class="table">
          <thead>
          <tr>
            <th>ID</th>
            <th>유저</th>
            <th class="r">총 레벨</th>
            <th class="r">출석</th>
            <th class="r">오답노트 작성</th>
            <th class="r">문제 복습</th>
            <th>가입일</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="u : ${users}" th:attr="data-href=@{/admin/user/{id}(id=${u.userId()})}">
            <td class="muted num" th:text="${u.userId()}">1</td>
            <td>
              <div class="who">
                <b th:text="${u.name() != null ? u.name() : '(이름 없음)'}">이름</b>
                <span th:text="${u.email() != null ? u.email() : '-'}">email</span>
              </div>
            </td>
            <td class="r"><span class="level">Lv.<th:block th:text="${u.totalStudyLevel()}">1</th:block></span></td>
            <td class="r num" th:text="|Lv.${u.attendanceLevel()}|">Lv.1</td>
            <td class="r num" th:text="|Lv.${u.noteWriteLevel()}|">Lv.1</td>
            <td class="r num" th:text="|Lv.${u.problemPracticeLevel()}|">Lv.1</td>
            <td class="nowrap muted num" th:text="${u.createdAt() != null ? #temporals.format(u.createdAt(), 'yyyy-MM-dd HH:mm') : '-'}">-</td>
          </tr>
          </tbody>
        </table>
        <div class="empty" th:if="${#lists.isEmpty(users)}"
             th:text="${type == 'new'} ? '이 날 가입한 유저가 없어요' : '이 날 출석한 유저가 없어요'">없어요</div>
      </div>
    </div>

  </main>
</div>
<th:block th:replace="~{fragments/admin-layout :: scripts}"></th:block>
</body>
</html>
