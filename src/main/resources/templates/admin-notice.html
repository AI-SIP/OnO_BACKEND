<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-layout :: head('공지')}"></head>
<body>
<div class="shell">
  <aside th:replace="~{fragments/admin-layout :: sidebar('notice')}"></aside>
  <main class="main" data-reveal>
    <div class="page-head">
      <div>
        <h1>공지</h1>
        <p class="desc">앱을 켠 모든 유저에게 팝업으로 보여요. 한 번에 하나만 걸 수 있어요.</p>
      </div>
    </div>

    <div>
      <div class="notice-box ok" th:if="${resultMessage}" th:text="${resultMessage}">등록했어요</div>
      <div class="notice-box err" th:if="${errorMessage}" th:text="${errorMessage}">오류</div>
    </div>

    <div class="grid grid-2">
      <div class="card">
        <h2 class="card-title">지금 걸려 있는 공지</h2>
        <div th:if="${activeNotice == null}" class="empty" style="padding: 36px 0;">걸려 있는 공지가 없어요.</div>
        <div th:if="${activeNotice != null}">
          <div class="gap-8">
            <span class="chip" th:classappend="${activeNotice.type().name() == 'WARNING'} ? 'orange' : 'blue'"
                  th:text="${activeNotice.type().name() == 'WARNING'} ? '주의' : '안내'">안내</span>
            <span class="small muted num" th:text="|${#temporals.format(activeNotice.expiresAt(), 'M월 d일 HH:mm')}까지|">까지</span>
          </div>
          <h3 style="margin: 14px 0 8px; font-size: 18px;" th:text="${activeNotice.title()}">제목</h3>
          <div class="quote" th:text="${activeNotice.content()}">내용</div>
          <form id="removeForm" th:action="@{/admin/notice/{id}/delete(id=${activeNotice.noticeId()})}" method="post" class="mt-20">
            <button type="button" class="btn danger" onclick="OnoAdmin.openModal('removeModal')">지금 내리기</button>
          </form>
        </div>
      </div>

      <div class="card">
        <h2 class="card-title">새 공지 <small>걸려 있는 공지는 자동으로 내려가요</small></h2>
        <form id="noticeForm" th:action="@{/admin/notice}" method="post" style="display: flex; flex-direction: column; gap: 16px;">
          <div class="field">
            <label for="title">제목</label>
            <input class="input" type="text" id="title" name="title" maxlength="100" required placeholder="최대 100자">
          </div>
          <div class="field">
            <label for="content">내용</label>
            <textarea class="textarea" id="content" name="content" maxlength="500" required placeholder="최대 500자"></textarea>
          </div>
          <div class="grid grid-2">
            <div class="field">
              <label for="type">유형</label>
              <select class="select" id="type" name="type">
                <option th:each="noticeType : ${noticeTypes}" th:value="${noticeType}"
                        th:text="${noticeType.name() == 'WARNING'} ? '주의 (점검, 장애)' : '안내'">안내</option>
              </select>
            </div>
            <div class="field">
              <label for="durationHours">노출 시간</label>
              <input class="input" type="number" id="durationHours" name="durationHours" min="1" max="168" value="24">
            </div>
          </div>
          <div>
            <button type="submit" class="btn primary">공지 걸기</button>
          </div>
        </form>
      </div>
    </div>
  </main>
</div>

<div class="modal" id="publishModal" onclick="if (event.target === this) OnoAdmin.closeModal('publishModal')">
  <div class="modal-sheet">
    <h3>이 공지를 모든 유저에게 보여줄까요?</h3>
    <p class="muted small" id="publishSummary" style="margin: -8px 0 0;"></p>
    <div class="modal-actions">
      <button type="button" class="btn" onclick="OnoAdmin.closeModal('publishModal')">취소</button>
      <button type="button" class="btn primary" id="publishConfirm">공지 걸기</button>
    </div>
  </div>
</div>

<div class="modal" id="removeModal" onclick="if (event.target === this) OnoAdmin.closeModal('removeModal')">
  <div class="modal-sheet">
    <h3>공지를 지금 내릴까요?</h3>
    <div class="modal-actions">
      <button type="button" class="btn" onclick="OnoAdmin.closeModal('removeModal')">취소</button>
      <button type="button" class="btn danger" onclick="document.getElementById('removeForm').submit()">내리기</button>
    </div>
  </div>
</div>

<th:block th:replace="~{fragments/admin-layout :: scripts}"></th:block>
<script>
  // 공지는 실사용자 전원에게 바로 뜨므로 한 번 더 확인받는다.
  (function () {
    var form = document.getElementById('noticeForm');
    var confirmed = false;
    form.addEventListener('submit', function (e) {
      if (confirmed) return;
      e.preventDefault();
      var hours = document.getElementById('durationHours').value || '24';
      document.getElementById('publishSummary').textContent =
        '"' + document.getElementById('title').value + '" · ' + hours + '시간 동안 노출돼요';
      OnoAdmin.openModal('publishModal');
    });
    document.getElementById('publishConfirm').addEventListener('click', function () {
      confirmed = true;
      form.requestSubmit();
    });
  })();
</script>
</body>
</html>
