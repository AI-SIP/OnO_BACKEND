<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-layout :: head('복습 기록')}"></head>
<body>
<div class="shell">
  <aside th:replace="~{fragments/admin-layout :: sidebar('solves')}"></aside>
  <main class="main" data-reveal>

    <div class="page-head">
      <div>
        <h1>복습 기록</h1>
        <p class="desc">유저가 오답노트를 다시 풀 때마다 남긴 기록이에요. 위 숫자는 게스트와 관리자 계정을 빼고 셌어요.</p>
      </div>
    </div>

    <div class="kpis">
      <div class="kpi">
        <div class="kpi-label" th:text="${filtered} ? '조건에 맞는 복습' : '전체 복습'">전체 복습</div>
        <div class="kpi-value"><span data-count th:text="${#numbers.formatInteger(summary.total(), 1, 'COMMA')}">0</span><span class="unit">회</span></div>
      </div>
      <a class="kpi" th:href="@{/admin/practice-logs(date=${#temporals.format(#temporals.createToday(), 'yyyy-MM-dd')})}">
        <div class="kpi-label">오늘</div>
        <div class="kpi-value"><span data-count th:text="${#numbers.formatInteger(todaySolveCount, 1, 'COMMA')}">0</span><span class="unit">회</span></div>
      </a>
      <div class="kpi">
        <div class="kpi-label">정답률</div>
        <div class="kpi-value"><span data-count th:text="${#numbers.formatDecimal(summary.correctRate(), 1, 1)}">0.0</span><span class="unit">%</span></div>
        <div class="kpi-sub">결과를 남긴 기록 기준</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">평균 소요 시간</div>
        <div class="kpi-value" th:text="${summary.averageTimeText() ?: '-'}">-</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">회고를 쓴 기록</div>
        <div class="kpi-value"><span data-count th:text="${#numbers.formatInteger(summary.withReflection(), 1, 'COMMA')}">0</span><span class="unit">회</span></div>
      </div>
    </div>

    <section class="section" th:if="${summary.total() > 0}">
      <div class="card">
        <h2 class="card-title">결과 분포</h2>
        <div class="stack">
          <span th:style="|width: ${summary.correct() * 100.0 / summary.total()}%; background: var(--brand)|"></span>
          <span th:style="|width: ${summary.partial() * 100.0 / summary.total()}%; background: var(--orange)|"></span>
          <span th:style="|width: ${summary.wrong() * 100.0 / summary.total()}%; background: var(--red)|"></span>
          <span th:style="|width: ${summary.unknown() * 100.0 / summary.total()}%; background: var(--t4)|"></span>
        </div>
        <div class="legend">
          <a th:href="@{/admin/practice-logs(date=${filterDate}, userId=${filterUserId}, answerStatus='CORRECT')}"><i style="background: var(--brand)"></i>정답 <b class="num" th:text="${summary.correct()}">0</b></a>
          <a th:href="@{/admin/practice-logs(date=${filterDate}, userId=${filterUserId}, answerStatus='PARTIAL')}"><i style="background: var(--orange)"></i>부분 정답 <b class="num" th:text="${summary.partial()}">0</b></a>
          <a th:href="@{/admin/practice-logs(date=${filterDate}, userId=${filterUserId}, answerStatus='WRONG')}"><i style="background: var(--red)"></i>오답 <b class="num" th:text="${summary.wrong()}">0</b></a>
          <a th:href="@{/admin/practice-logs(date=${filterDate}, userId=${filterUserId}, answerStatus='UNKNOWN')}"><i style="background: var(--t4)"></i>결과 없음 <b class="num" th:text="${summary.unknown()}">0</b></a>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="card">
        <form class="toolbar" th:action="@{/admin/practice-logs}" method="get">
          <div class="field">
            <label for="date">복습일</label>
            <input class="input" type="date" id="date" name="date" th:value="${filterDate}">
          </div>
          <div class="field">
            <label for="userId">유저 ID</label>
            <input class="input" type="number" id="userId" name="userId" min="1" placeholder="예: 519" th:value="${filterUserId}">
          </div>
          <div class="field">
            <label for="answerStatus">결과</label>
            <select class="select" id="answerStatus" name="answerStatus">
              <option value="">전체</option>
              <option th:each="s : ${answerStatuses}" th:value="${s.name()}" th:selected="${s.name() == filterStatus}">
                <th:block th:replace="~{fragments/admin-learning :: answerLabel(${s.name()})}"></th:block>
              </option>
            </select>
          </div>
          <div class="field">
            <label for="size">한 번에</label>
            <select class="select" id="size" name="size">
              <option th:each="n : ${ {20, 50, 100} }" th:value="${n}" th:text="|${n}개|" th:selected="${n == size}">20개</option>
            </select>
          </div>
          <button type="submit" class="btn primary">조회</button>
          <a th:if="${filtered}" class="btn" th:href="@{/admin/practice-logs}">초기화</a>
        </form>
      </div>
    </section>

    <section class="section">
      <div class="filter-bar" th:if="${filtered}">
        <span th:if="${filterDate != null}" class="chip green" th:text="|복습일 ${filterDate}|">복습일</span>
        <span th:if="${filterUserId != null}" class="chip green"
              th:text="${filterUserName != null} ? |${filterUserName} (ID ${filterUserId})| : |유저 ID ${filterUserId}|">유저</span>
        <span th:if="${filterStatus != null}" class="chip green">
          <th:block th:replace="~{fragments/admin-learning :: answerLabel(${filterStatus})}"></th:block>
        </span>
        <a class="clear" th:href="@{/admin/practice-logs}">필터 해제</a>
      </div>

      <div class="card flush">
        <div class="table-wrap">
          <table class="table">
            <thead>
            <tr>
              <th>복습 시각</th>
              <th>유저</th>
              <th>문제</th>
              <th>결과</th>
              <th>소요 시간</th>
              <th>회고</th>
              <th>기분</th>
              <th class="r">사진</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="s : ${solves}" th:attr="data-href=${s.problemId != null} ? @{/admin/problem/{id}(id=${s.problemId})} : null">
              <td class="nowrap num" th:text="${#temporals.format(s.practicedAt, 'yyyy-MM-dd HH:mm')}">날짜</td>
              <td th:insert="~{fragments/admin-learning :: who(${s.userId}, ${s.userName}, ${s.userEmail})}"></td>
              <td>
                <div class="ellipsis strong" th:text="${s.problemReference != null and !#strings.isEmpty(s.problemReference)} ? ${s.problemReference} : |오답노트 #${s.problemId}|">문제</div>
                <div class="ellipsis small muted" th:if="${s.problemMemo != null and !#strings.isEmpty(s.problemMemo)}" th:text="${s.problemMemo}">메모</div>
              </td>
              <td>
                <div class="gap-8">
                  <th:block th:replace="~{fragments/admin-learning :: answerChip(${s.answerStatus})}"></th:block>
                  <span class="chip" th:if="${s.migratedFromLegacy}">이관</span>
                </div>
              </td>
              <td class="nowrap" th:classappend="${s.timeSpentText() == null} ? 'muted'" th:text="${s.timeSpentText() ?: '-'}">-</td>
              <td class="ellipsis" th:classappend="${s.reflection == null} ? 'muted'" th:text="${s.reflection != null and !#strings.isEmpty(s.reflection)} ? ${s.reflection} : '-'">회고</td>
              <td class="small" th:classappend="${s.moodEmojiKey == null} ? 'muted'" th:text="${s.moodEmojiKey ?: '-'}">기분</td>
              <td class="r" th:classappend="${s.imageCount == 0} ? 'zero'" th:text="${s.imageCount}">0</td>
            </tr>
            </tbody>
          </table>
          <div class="empty" th:if="${#lists.isEmpty(solves)}">조건에 맞는 복습 기록이 없어요.</div>
        </div>
        <div th:replace="~{fragments/admin-layout :: pager(${pager})}"></div>
      </div>
    </section>

  </main>
</div>
<th:block th:replace="~{fragments/admin-layout :: scripts}"></th:block>
</body>
</html>
