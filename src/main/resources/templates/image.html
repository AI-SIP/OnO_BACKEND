<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-layout :: head('이미지')}"></head>
<body class="viewer" th:with="safeUrl=${imageUrl != null and (#strings.startsWith(imageUrl, 'https://') or #strings.startsWith(imageUrl, 'http://'))}">
<div class="viewer-bar">
  <a class="btn small" href="javascript:history.length > 1 ? history.back() : window.close()">닫기</a>
  <a class="btn small primary" th:if="${safeUrl}" th:href="${imageUrl}" target="_blank" rel="noopener noreferrer">원본 열기</a>
</div>
<!--/* url 은 쿼리 파라미터라 아무 값이나 올 수 있다. javascript: 같은 값은 링크로 만들지 않는다. */-->
<main class="viewer-stage">
  <img th:if="${safeUrl}" th:src="${imageUrl}" alt="이미지">
  <p th:unless="${safeUrl}" style="color: #fff">열 수 없는 이미지 주소예요.</p>
</main>
<style>
  body.viewer { background: #191f28; min-height: 100vh; display: flex; flex-direction: column; }
  .viewer-bar { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 16px; }
  .viewer-bar .btn:not(.primary) { background: rgba(255, 255, 255, .12); color: #fff; }
  .viewer-bar .btn:not(.primary):hover { background: rgba(255, 255, 255, .2); }
  .viewer-stage { flex: 1; display: flex; align-items: center; justify-content: center; padding: 0 16px 24px; }
  .viewer-stage img { max-width: 100%; max-height: calc(100vh - 100px); border-radius: 12px; background: #fff; animation: reveal .3s var(--ease) both; }
</style>
<th:block th:replace="~{fragments/admin-layout :: scripts}"></th:block>
</body>
</html>
