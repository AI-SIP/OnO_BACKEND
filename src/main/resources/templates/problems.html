<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-layout :: head('오답노트')}"></head>
<body>
<div class="shell">
  <aside th:replace="~{fragments/admin-layout :: sidebar('problems')}"></aside>
  <main class="main" data-reveal>

    <div class="page-head">
      <div>
        <h1>오답노트</h1>
        <p class="desc">유저가 등록한 문제와 AI 분석 결과를 봐요. 위 숫자는 게스트와 관리자 계정을 빼고 셌어요.</p>
      </div>
    </div>

    <div class="kpis">
      <a class="kpi" th:href="@{/admin/problems}">
        <div class="kpi-label">전체</div>
        <div class="kpi-value"><span data-count th:text="${#numbers.formatInteger(summary.total(), 1, 'COMMA')}">0</span><span class="unit">개</span></div>
      </a>
      <a class="kpi" th:href="@{/admin/problems(date=${#temporals.format(#temporals.createToday(), 'yyyy-MM-dd')})}">
        <div class="kpi-label">오늘 등록</div>
        <div class="kpi-value"><span data-count th:text="${#numbers.formatInteger(summary.today(), 1, 'COMMA')}">0</span><span class="unit">개</span></div>
      </a>
      <a class="kpi" th:href="@{/admin/problems(status='FAILED')}">
        <div class="kpi-label">분석 실패</div>
        <div class="kpi-value" th:classappend="${summary.failed() > 0} ? 'red'"><span data-count th:text="${#numbers.formatInteger(summary.failed(), 1, 'COMMA')}">0</span><span class="unit">개</span></div>
      </a>
      <a class="kpi" th:href="@{/admin/problems(status='RATE_LIMIT_EXCEEDED')}">
        <div class="kpi-label">요청 제한 초과</div>
        <div class="kpi-value"><span data-count th:text="${#numbers.formatInteger(summary.rateLimited(), 1, 'COMMA')}">0</span><span class="unit">개</span></div>
      </a>
      <a class="kpi" th:href="@{/admin/problems(status='PROCESSING')}">
        <div class="kpi-label">분석 중</div>
        <div class="kpi-value"><span data-count th:text="${#numbers.formatInteger(summary.processing(), 1, 'COMMA')}">0</span><span class="unit">개</span></div>
      </a>
    </div>

    <section class="section">
      <div class="card">
        <form class="toolbar" th:action="@{/admin/problems}" method="get">
          <div class="field">
            <label for="date">등록일</label>
            <input class="input" type="date" id="date" name="date" th:value="${filterDate}">
          </div>
          <div class="field">
            <label for="userId">유저 ID</label>
            <input class="input" type="number" id="userId" name="userId" min="1" placeholder="예: 519" th:value="${filterUserId}">
          </div>
          <div class="field">
            <label for="status">분석 상태</label>
            <select class="select" id="status" name="status">
              <option value="">전체</option>
              <option th:each="s : ${statuses}" th:value="${s.name()}" th:selected="${s.name() == filterStatus}">
                <th:block th:replace="~{fragments/admin-learning :: analysisLabel(${s.name()})}"></th:block>
              </option>
            </select>
          </div>
          <div class="field">
            <label for="size">한 번에</label>
            <select class="select" id="size" name="size">
              <option th:each="n : ${ {20, 50, 100} }" th:value="${n}" th:text="|${n}개|" th:selected="${n == size}">20개</option>
            </select>
          </div>
          <button type="submit" class="btn primary">조회</button>
          <a th:if="${filtered}" class="btn" th:href="@{/admin/problems}">초기화</a>
        </form>
      </div>
    </section>

    <section class="section">
      <div class="filter-bar" th:if="${filtered}">
        <span th:if="${filterDate != null}" class="chip green" th:text="|등록일 ${filterDate}|">등록일</span>
        <span th:if="${filterUserId != null}" class="chip green"
              th:text="${filterUserName != null} ? |${filterUserName} (ID ${filterUserId})| : |유저 ID ${filterUserId}|">유저</span>
        <span th:if="${filterStatus != null}" class="chip green">
          <th:block th:replace="~{fragments/admin-learning :: analysisLabel(${filterStatus})}"></th:block>
        </span>
        <span class="num" th:text="|${#numbers.formatInteger(totalProblems, 1, 'COMMA')}개|">0개</span>
        <a class="clear" th:href="@{/admin/problems}">필터 해제</a>
      </div>

      <div class="card flush">
        <div class="table-wrap">
          <table class="table">
            <thead>
            <tr>
              <th>ID</th>
              <th>작성자</th>
              <th>출처 / 메모</th>
              <th>폴더</th>
              <th>분석</th>
              <th class="r">복습</th>
              <th class="r">태그</th>
              <th>등록일</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${problems}" th:attr="data-href=@{/admin/problem/{id}(id=${p.problemId()})}">
              <td class="num muted" th:text="${p.problemId()}">1</td>
              <td th:insert="~{fragments/admin-learning :: who(${p.userId()}, ${p.userName()}, ${p.userEmail()})}"></td>
              <td>
                <div class="ellipsis strong" th:text="${p.reference != null and !#strings.isEmpty(p.reference)} ? ${p.reference} : '출처 없음'">출처</div>
                <div class="ellipsis small muted" th:if="${p.memo != null and !#strings.isEmpty(p.memo)}" th:text="${p.memo}">메모</div>
              </td>
              <td class="nowrap" th:text="${p.folderName ?: '-'}">폴더</td>
              <td>
                <div class="gap-8">
                  <th:block th:replace="~{fragments/admin-learning :: analysisChip(${p.analysisStatus})}"></th:block>
                  <span class="small muted" th:if="${p.subject != null}" th:text="${p.problemType != null} ? |${p.subject} · ${p.problemType}| : ${p.subject}">수학</span>
                </div>
              </td>
              <td class="r" th:classappend="${p.solveCount == 0} ? 'zero'" th:text="${p.solveCount}">0</td>
              <td class="r" th:classappend="${p.tagCount == 0} ? 'zero'" th:text="${p.tagCount}">0</td>
              <td class="nowrap muted" th:text="${#temporals.format(p.createdAt, 'yyyy-MM-dd HH:mm')}">2026-01-01</td>
            </tr>
            </tbody>
          </table>
          <div class="empty" th:if="${#lists.isEmpty(problems)}">조건에 맞는 오답노트가 없어요.</div>
        </div>
        <div th:replace="~{fragments/admin-layout :: pager(${pager})}"></div>
      </div>
    </section>

  </main>
</div>
<th:block th:replace="~{fragments/admin-layout :: scripts}"></th:block>
</body>
</html>
