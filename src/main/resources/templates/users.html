<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-layout :: head('유저')}"></head>
<body>
<div class="shell">
  <aside th:replace="~{fragments/admin-layout :: sidebar('users')}"></aside>
  <main class="main" data-reveal>

    <div class="page-head">
      <div>
        <h1>유저</h1>
        <p class="desc">탈퇴하지 않은 계정만 보여요. 위 숫자는 게스트와 관리자 계정을 빼고 셌어요.</p>
      </div>
    </div>

    <div class="kpis">
      <div class="kpi">
        <div class="kpi-label">전체 유저</div>
        <div class="kpi-value"><span data-count th:text="${#numbers.formatInteger(summary.totalUsers(), 1, 'COMMA')}">0</span><span class="unit">명</span></div>
      </div>
      <div class="kpi">
        <div class="kpi-label">오늘 가입</div>
        <div class="kpi-value"><span data-count th:text="${summary.todaySignups()}">0</span><span class="unit">명</span></div>
      </div>
      <div class="kpi">
        <div class="kpi-label">최근 7일 출석</div>
        <div class="kpi-value"><span data-count th:text="${#numbers.formatInteger(summary.activeUsersLast7Days(), 1, 'COMMA')}">0</span><span class="unit">명</span></div>
      </div>
    </div>

    <div class="card section">
      <form th:action="@{/admin/users}" method="get" class="toolbar">
        <div class="field grow">
          <label for="q">검색</label>
          <input id="q" class="input" type="search" name="q" th:value="${q}" placeholder="이름, 이메일, 유저 ID">
        </div>
        <div class="field">
          <label for="platform">가입 경로</label>
          <select id="platform" class="select" name="platform">
            <option value="">전체</option>
            <option th:each="p : ${platforms}" th:value="${p}" th:text="${p}" th:selected="${platform != null and #strings.equalsIgnoreCase(p, platform)}">GUEST</option>
          </select>
        </div>
        <div class="field">
          <label for="sortBy">정렬</label>
          <select id="sortBy" class="select" name="sortBy">
            <option value="createdAt" th:selected="${sortBy == 'createdAt'}">가입일</option>
            <option value="lastActiveAt" th:selected="${sortBy == 'lastActiveAt'}">최근 활동</option>
            <option value="totalStudyLevel" th:selected="${sortBy == 'totalStudyLevel'}">총 레벨</option>
            <option value="problemCount" th:selected="${sortBy == 'problemCount'}">오답노트 수</option>
            <option value="solveCount" th:selected="${sortBy == 'solveCount'}">복습 수</option>
            <option value="practiceNoteCount" th:selected="${sortBy == 'practiceNoteCount'}">복습노트 수</option>
            <option value="name" th:selected="${sortBy == 'name'}">이름</option>
          </select>
        </div>
        <div class="field">
          <label for="direction">순서</label>
          <select id="direction" class="select" name="direction">
            <option value="desc" th:selected="${direction != 'asc'}">많은 순, 최신 순</option>
            <option value="asc" th:selected="${direction == 'asc'}">적은 순, 오래된 순</option>
          </select>
        </div>
        <div class="field">
          <label for="size">개수</label>
          <select id="size" class="select" name="size">
            <option th:each="n : ${ {20, 50, 100} }" th:value="${n}" th:text="|${n}개|" th:selected="${size == n}">20개</option>
          </select>
        </div>
        <button type="submit" class="btn primary">적용</button>
      </form>
    </div>

    <div class="section">
      <div class="filter-bar" th:if="${q != null or platform != null}">
        <span class="num" th:text="|검색 결과 ${#numbers.formatInteger(totalUsers, 1, 'COMMA')}명|">검색 결과 0명</span>
        <span class="chip" th:if="${q != null}" th:text="|검색어: ${q}|">검색어</span>
        <span class="chip" th:if="${platform != null}" th:text="|가입 경로: ${platform}|">가입 경로</span>
        <a class="clear" th:href="@{/admin/users}">필터 지우기</a>
      </div>

      <div class="card flush">
        <div class="table-wrap">
          <table class="table">
            <thead>
            <tr>
              <th>ID</th>
              <th>유저</th>
              <th>가입 경로</th>
              <th class="r">총 레벨</th>
              <th class="r">오답노트</th>
              <th class="r">복습 기록</th>
              <th class="r">복습노트</th>
              <th>최근 활동</th>
              <th>가입일</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="u : ${users}" th:attr="data-href=@{/admin/user/{id}(id=${u.userId()})}">
              <td class="muted num" th:text="${u.userId()}">1</td>
              <td>
                <div class="who">
                  <b th:text="${u.name() != null ? u.name() : '(이름 없음)'}">이름</b>
                  <span th:text="${u.email() != null ? u.email() : '-'}">email</span>
                </div>
              </td>
              <td>
                <span th:if="${u.platform() != null}" class="chip"
                      th:classappend="${#strings.equalsIgnoreCase(u.platform(), 'GUEST')} ? '' : 'green'"
                      th:text="${#strings.toUpperCase(u.platform())}">GOOGLE</span>
                <span th:if="${u.platform() == null}" class="muted">-</span>
              </td>
              <td class="r">
                <span class="level">Lv.<th:block th:text="${u.totalStudyLevel()}">1</th:block><small th:text="|${u.totalStudyPoint()}pt|">0pt</small></span>
              </td>
              <td class="r" th:classappend="${u.problemCount() == 0} ? 'zero'" th:text="${u.problemCount()}">0</td>
              <td class="r" th:classappend="${u.solveCount() == 0} ? 'zero'" th:text="${u.solveCount()}">0</td>
              <td class="r" th:classappend="${u.practiceNoteCount() == 0} ? 'zero'" th:text="${u.practiceNoteCount()}">0</td>
              <td class="nowrap muted num" th:text="${u.lastActiveAt() != null ? #temporals.format(u.lastActiveAt(), 'yyyy-MM-dd HH:mm') : '-'}">-</td>
              <td class="nowrap muted num" th:text="${u.createdAt() != null ? #temporals.format(u.createdAt(), 'yyyy-MM-dd HH:mm') : '-'}">2026-01-01</td>
            </tr>
            </tbody>
          </table>
          <div class="empty" th:if="${#lists.isEmpty(users)}">조건에 맞는 유저가 없어요</div>
        </div>
        <div th:replace="~{fragments/admin-layout :: pager(${pager})}"></div>
      </div>
    </div>

  </main>
</div>
<th:block th:replace="~{fragments/admin-layout :: scripts}"></th:block>
</body>
</html>
