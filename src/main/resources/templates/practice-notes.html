<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-layout :: head('복습노트')}"></head>
<body>
<div class="shell">
  <aside th:replace="~{fragments/admin-layout :: sidebar('notes')}"></aside>
  <main class="main" data-reveal>

    <div class="page-head">
      <div>
        <h1>복습노트</h1>
        <p class="desc">오답노트를 묶어 둔 복습 세트예요.</p>
      </div>
    </div>

    <div class="kpis">
      <div class="kpi">
        <div class="kpi-label">전체</div>
        <div class="kpi-value"><span data-count th:text="${#numbers.formatInteger(summary.total(), 1, 'COMMA')}">0</span><span class="unit">개</span></div>
      </div>
      <div class="kpi">
        <div class="kpi-label">한 번 이상 복습</div>
        <div class="kpi-value"><span data-count th:text="${#numbers.formatInteger(summary.practiced(), 1, 'COMMA')}">0</span><span class="unit">개</span></div>
        <div class="kpi-sub" th:if="${summary.total() > 0}"
             th:text="|전체의 ${#numbers.formatDecimal(summary.practiced() * 100.0 / summary.total(), 1, 1)}%|">0%</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">누적 복습 횟수</div>
        <div class="kpi-value"><span data-count th:text="${#numbers.formatInteger(summary.totalPracticeCount(), 1, 'COMMA')}">0</span><span class="unit">회</span></div>
      </div>
      <div class="kpi">
        <div class="kpi-label">알림을 켠 노트</div>
        <div class="kpi-value"><span data-count th:text="${#numbers.formatInteger(summary.withNotification(), 1, 'COMMA')}">0</span><span class="unit">개</span></div>
      </div>
    </div>

    <section class="section">
      <div class="card">
        <form class="toolbar" th:action="@{/admin/practice-notes}" method="get">
          <div class="field">
            <label for="date">만든 날</label>
            <input class="input" type="date" id="date" name="date" th:value="${filterDate}">
          </div>
          <div class="field">
            <label for="userId">유저 ID</label>
            <input class="input" type="number" id="userId" name="userId" min="1" placeholder="예: 519" th:value="${filterUserId}">
          </div>
          <div class="field">
            <label for="size">한 번에</label>
            <select class="select" id="size" name="size">
              <option th:each="n : ${ {20, 50, 100} }" th:value="${n}" th:text="|${n}개|" th:selected="${n == size}">20개</option>
            </select>
          </div>
          <button type="submit" class="btn primary">조회</button>
          <a th:if="${filtered}" class="btn" th:href="@{/admin/practice-notes}">초기화</a>
        </form>
      </div>
    </section>

    <section class="section">
      <div class="filter-bar" th:if="${filtered}">
        <span th:if="${filterDate != null}" class="chip green" th:text="|만든 날 ${filterDate}|">날짜</span>
        <span th:if="${filterUserId != null}" class="chip green"
              th:text="${filterUserName != null} ? |${filterUserName} (ID ${filterUserId})| : |유저 ID ${filterUserId}|">유저</span>
        <span class="num" th:text="|${#numbers.formatInteger(totalPracticeNotes, 1, 'COMMA')}개|">0개</span>
        <a class="clear" th:href="@{/admin/practice-notes}">필터 해제</a>
      </div>

      <div class="card flush">
        <div class="table-wrap">
          <table class="table">
            <thead>
            <tr>
              <th>제목</th>
              <th>유저</th>
              <th class="r">문제</th>
              <th class="r">복습</th>
              <th>마지막 복습</th>
              <th>알림</th>
              <th>만든 날</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="n : ${practiceNotes}" th:attr="data-href=@{/admin/practice-notes/{id}(id=${n.noteId})}">
              <td>
                <div class="ellipsis strong" th:text="${n.title != null and !#strings.isEmpty(n.title)} ? ${n.title} : '제목 없음'">제목</div>
                <div class="small muted num" th:text="|#${n.noteId}|">#1</div>
              </td>
              <td th:insert="~{fragments/admin-learning :: who(${n.userId}, ${n.userName}, ${n.userEmail})}"></td>
              <td class="r" th:classappend="${n.problemCount == 0} ? 'zero'" th:text="${n.problemCount}">0</td>
              <td class="r" th:classappend="${n.practiceCount == 0} ? 'zero'" th:text="${n.practiceCount}">0</td>
              <td class="nowrap" th:classappend="${n.lastSolvedAt == null} ? 'muted'"
                  th:text="${n.lastSolvedAt != null} ? ${#temporals.format(n.lastSolvedAt, 'yyyy-MM-dd HH:mm')} : '-'">-</td>
              <td class="nowrap">
                <span th:if="${n.hasNotification()}" class="chip blue" th:text="${n.notificationText()}">매일 21:00</span>
                <span th:unless="${n.hasNotification()}" class="muted">끔</span>
              </td>
              <td class="nowrap muted" th:text="${#temporals.format(n.createdAt, 'yyyy-MM-dd HH:mm')}">날짜</td>
            </tr>
            </tbody>
          </table>
          <div class="empty" th:if="${#lists.isEmpty(practiceNotes)}">조건에 맞는 복습노트가 없어요.</div>
        </div>
        <div th:replace="~{fragments/admin-layout :: pager(${pager})}"></div>
      </div>
    </section>

  </main>
</div>
<th:block th:replace="~{fragments/admin-layout :: scripts}"></th:block>
</body>
</html>
